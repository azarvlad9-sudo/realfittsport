<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування клієнта</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; }
        .form-container {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input[type="text"], select, input[type="file"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box;
        }
        .btn-save {
            background: #27ae60; color: white; padding: 14px; border: none;
            border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px;
        }
        .btn-save:hover { background: #219150; }

        .btn-delete {
            display: block; width: 100%; padding: 12px; background: #e74c3c;
            color: white; text-align: center; border-radius: 8px; text-decoration: none;
            font-weight: bold; box-sizing: border-box; font-size: 14px; margin-bottom: 10px;
        }
        .btn-delete:hover { background: #c0392b; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>{% if client %}Редагувати клієнта{% else %}Новий клієнт{% endif %}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}

            <button type="submit" class="btn-save">Зберегти дані</button>
        </form>

        {% if client %}
            <a href="{% url 'client_delete' pk=client.pk %}" class="btn-delete" onclick="return confirm('Ви впевнені, що хочете видалити цього клієнта?');">🗑 Видалити клієнта</a>
        {% endif %}

        <a href="{% url 'home' %}" class="back-link">← Скасувати та повернутися</a>
    </div>
</body>
</html>
